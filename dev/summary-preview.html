<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summary view preview</title>
<!-- Stylesheet is injected with a cache-busting query below so edits show on reload. -->
<style>
  /* Harness chrome only. Not part of the app. */
  #harness-bar{position:fixed;top:0;left:0;right:0;z-index:9000;display:flex;flex-wrap:wrap;gap:6px;
    align-items:center;padding:8px 14px;background:#000;border-bottom:1px solid #30363d;font-size:12px;}
  #harness-bar a{color:#8b949e;text-decoration:none;padding:3px 9px;border:1px solid #30363d;border-radius:6px;}
  #harness-bar a.on{color:#0d1117;background:#e3b341;border-color:#e3b341;font-weight:700;}
  #harness-bar .sp{flex:1;}
  body{padding-top:44px;}
</style>
</head>
<body data-view="summary">
<div id="harness-bar"></div>

<div id="summary-view">
  <div class="sum-bar">
    <select class="capture-sel" id="sum-range" title="Range">
      <option value="14">2 weeks</option>
      <option value="28" selected>4 weeks</option>
      <option value="56">8 weeks</option>
      <option value="84">12 weeks</option>
    </select>
    <div class="iss-chips" id="sum-projects" aria-label="Projects"></div>
    <span class="tl-summary" id="sum-summary"></span>
  </div>
  <div class="stats-row" id="sum-tiles"></div>
  <div class="sum-bento" id="sum-figs"></div>
  <div class="sum-health" id="sum-health"></div>
</div>
<div id="toast"></div>

<script type="module">
// Cache-bust the stylesheet and fixtures, same pattern as timeline-preview.html.
const bust = `?t=${Date.now()}`;
const link = document.createElement('link');
link.rel = 'stylesheet';
link.href = '../src/renderer/styles.css' + bust;
document.head.appendChild(link);

import(`./summary-fixtures.js${bust}`).then(async ({ FIXTURES }) => {
  const state = FIXTURES[new URL(location.href).searchParams.get('state')]
    ? new URL(location.href).searchParams.get('state') : 'busy';
  const fixture = FIXTURES[state];

  window.showToast = (m) => console.log('toast:', m);
  window.setView = (v) => console.log('setView:', v);
  window.copyText = (t) => { console.log('copyText:', t); return Promise.resolve(true); };
  window.electronAPI = {
    summaryLoad: async () => ({ commits: fixture.commits, sessions: fixture.sessions, prs: fixture.prs, issues: fixture.issues }),
    ideasLoad: async () => ({ rev: 1, ideas: fixture.ideas }),
    openExternal: async (u) => console.log('open:', u),
  };
  window.openIssue = (url) => console.log('openIssue:', url);

  const ideas = await import('../src/renderer/ideas-ui.js');
  await ideas.loadIdeas();
  const ui = await import('../src/renderer/summary-ui.js');
  const NAMES = { twig: 'Twig', 'twig-mobile': 'Twig Mobile', wda: 'Workspace Dashboard' };
  ui.setSummaryProjects((fixture.ws || []).map((p) => ({ id: p.id, name: NAMES[p.id] || p.id, repos: p.repos })));
  ui.initSummary();
  await ui.loadSummary();

  const bar = document.getElementById('harness-bar');
  bar.innerHTML = Object.keys(FIXTURES).map((k) =>
    `<a href="?state=${k}" class="${k === state ? 'on' : ''}">${k}</a>`).join('')
    + '<span class="sp"></span>';
});
</script>
</body>
</html>
